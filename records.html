<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Records — Paideia Mafia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Bebas+Neue&family=Source+Serif+4:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12181f;
    --ink-2:#1b232d;
    --parchment:#efe4c9;
    --parchment-dim:#b9ad8f;
    --gold:#c9a227;
    --gold-bright:#e4c856;
    --crimson:#7a1f2b;
    --crimson-bright:#a52a3a;
    --slate:#8b96a5;
    --display:'Fraunces', serif;
    --jersey:'Bebas Neue', sans-serif;
    --body:'Source Serif 4', serif;
    --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--parchment);
    font-family:var(--body);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }

  /* ===== NAV ===== */
  nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:36px;
    padding:22px 24px;
    border-bottom:1px solid rgba(201,162,39,.3);
    background:#0e131a;
    flex-wrap:wrap;
  }
  nav a{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:var(--slate);
    padding-bottom:4px;
    border-bottom:2px solid transparent;
  }
  nav a:hover, nav a.active{
    color:var(--gold);
    border-bottom-color:var(--gold);
  }

  /* ===== PAGE HEAD ===== */
  .page-head{
    text-align:center;
    padding:56px 24px 12px;
  }
  .page-eyebrow{
    font-family:var(--mono);
    letter-spacing:.35em;
    font-size:11px;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .page-title{
    font-family:var(--display);
    font-weight:900;
    font-size:clamp(36px,7vw,64px);
  }
  .page-sub{
    font-family:var(--mono);
    font-size:12px;
    color:var(--slate);
    margin-top:14px;
  }

  /* ===== TABLE WRAP ===== */
  .table-wrap{
    max-width:1180px;
    margin:44px auto 90px;
    padding:0 24px;
    overflow-x:auto;
  }
  table{
    width:100%;
    border-collapse:collapse;
    min-width:720px;
  }
  thead tr{
    background:var(--ink-2);
    border-bottom:2px solid var(--gold);
  }
  th{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--gold);
    text-align:right;
    padding:14px 16px;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  th:first-child{ text-align:left; }
  th:hover{ color:var(--gold-bright); }
  th .arrow{
    font-size:9px;
    margin-left:4px;
    opacity:.5;
  }
  th.sorted .arrow{ opacity:1; }
  tbody tr{
    border-bottom:1px solid rgba(239,228,201,.08);
    transition:background .15s ease;
  }
  tbody tr:hover{
    background:rgba(201,162,39,.06);
  }
  td{
    padding:13px 16px;
    text-align:right;
    font-family:var(--mono);
    font-size:13.5px;
    white-space:nowrap;
  }
  td:first-child{
    text-align:left;
    font-family:var(--display);
    font-weight:600;
    font-size:15px;
    color:var(--parchment);
  }
  .titles-cell{
    color:var(--slate);
  }
  .titles-cell.has-titles{
    color:var(--gold);
    font-weight:600;
  }
  .playoff-cell{
    color:var(--slate);
    font-style:italic;
  }

  .table-note{
    max-width:1180px;
    margin:0 auto 40px;
    padding:0 24px;
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--slate);
  }

  footer{
    text-align:center;
    padding:40px 24px 70px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--slate);
  }

  @media (max-width:640px){
    nav{ gap:18px; }
    th, td{ padding:11px 10px; font-size:12px; }
    td:first-child{ font-size:13.5px; }
  }
</style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="team-managers.html">Managers</a>
    <a href="records.html" class="active">Records</a>
    <a href="season-2025.html">2025 Season</a>
  </nav>

  <div class="page-head">
    <div class="page-eyebrow">The Ledger</div>
    <div class="page-title">All-Time Records</div>
    <div class="page-sub">Career totals since each manager's first season &middot; click any column to sort</div>
  </div>

  <div class="table-wrap">
    <table id="recordsTable">
      <thead>
        <tr>
          <th data-key="name" data-type="string" style="text-align:left;">Manager</th>
          <th data-key="seasons" data-type="number">S</th>
          <th data-key="winPct" data-type="number">Record</th>
          <th data-key="winPct" data-type="number">Win%</th>
          <th data-key="ppg" data-type="number">PPG</th>
          <th data-key="pag" data-type="number">PA/G</th>
          <th data-key="titles" data-type="number">Titles</th>
          <th data-key="playoff" data-type="string">Playoff</th>
        </tr>
      </thead>
      <tbody id="recordsBody"></tbody>
    </table>
  </div>

  <div class="table-note">Playoff records pulled directly from ESPN's bracket history, 2020&ndash;2025.</div>

  <footer>Paideia Mafia &middot; Records span 2020&ndash;2025</footer>

<script>
// ------------------------------------------------------------------
// CAREER TOTALS — calculated from full season-by-season standings.
// wins/losses/PF/PA are summed across every season each manager
// has been in the league; playoff left blank until we have that data.
// ------------------------------------------------------------------

const managers = [
  { name: "Robbie Moore",       seasons: 6, wins: 41, losses: 40, pf: 10100.52, pa: 9902.84,  titles: 2, playoff: "6-6" },
  { name: "Conner Kapperman",   seasons: 6, wins: 46, losses: 33, pf: 10064.52, pa: 9223.92,  titles: 1, playoff: "9-5" },
  { name: "Frank Brogden",      seasons: 6, wins: 40, losses: 41, pf: 10163.44, pa: 10173.08, titles: 0, playoff: "6-8" },
  { name: "Collin Thul",        seasons: 6, wins: 40, losses: 39, pf: 10096.78, pa: 9920.90,  titles: 1, playoff: "9-5" },
  { name: "Cameron Kapperman",  seasons: 3, wins: 20, losses: 22, pf: 5562.62,  pa: 5395.76,  titles: 0, playoff: "3-5" },
  { name: "EJ Crutcher",        seasons: 6, wins: 45, losses: 36, pf: 9988.94,  pa: 9648.42,  titles: 0, playoff: "4-9" },
  { name: "Eli Coppage",        seasons: 6, wins: 40, losses: 41, pf: 9988.98,  pa: 10191.66, titles: 0, playoff: "7-7" },
  { name: "JaDarion Derrick",   seasons: 6, wins: 25, losses: 54, pf: 8702.90,  pa: 9962.14,  titles: 0, playoff: "5-7" },
  { name: "Alex Evers",         seasons: 5, wins: 33, losses: 35, pf: 8036.18,  pa: 8340.44,  titles: 1, playoff: "7-4" },
  { name: "Gerald Jones",       seasons: 3, wins: 27, losses: 15, pf: 5670.44,  pa: 5240.28,  titles: 1, playoff: "5-3" },
];

// Derived fields
managers.forEach(m => {
  const games = m.wins + m.losses;
  m.record = `${m.wins}-${m.losses}`;
  m.winPct = games ? (m.wins / games) * 100 : 0;
  m.ppg = m.pf / games;
  m.pag = m.pa / games;
});

let sortKey = 'winPct';
let sortDir = 'desc';

function renderTable(){
  const sorted = [...managers].sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (typeof av === 'string') { av = av.toLowerCase(); bv = bv.toLowerCase(); }
    if (av < bv) return sortDir === 'asc' ? -1 : 1;
    if (av > bv) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });

  const body = document.getElementById('recordsBody');
  body.innerHTML = sorted.map(m => `
    <tr>
      <td>${m.name}</td>
      <td>${m.seasons}</td>
      <td>${m.record}</td>
      <td>${m.winPct.toFixed(1)}%</td>
      <td>${m.ppg.toFixed(1)}</td>
      <td>${m.pag.toFixed(1)}</td>
      <td class="titles-cell ${m.titles > 0 ? 'has-titles' : ''}">${m.titles}</td>
      <td class="playoff-cell">${m.playoff}</td>
    </tr>
  `).join('');

  document.querySelectorAll('th').forEach(th => {
    th.classList.toggle('sorted', th.dataset.key === sortKey);
    const arrow = th.querySelector('.arrow');
    if (arrow) arrow.remove();
    if (th.dataset.key === sortKey) {
      th.innerHTML += `<span class="arrow">${sortDir === 'asc' ? '▲' : '▼'}</span>`;
    }
  });
}

document.querySelectorAll('th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortKey === key) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortKey = key;
      sortDir = th.dataset.type === 'string' ? 'asc' : 'desc';
    }
    renderTable();
  });
});

renderTable();
</script>
</body>
</html>
